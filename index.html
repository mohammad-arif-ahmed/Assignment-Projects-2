<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower-Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="nav container font-inter">
        <div class="logo">
            <img src="assets/logo.png" alt="Logo">
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">About us</a></li>
        </ul>

        <div class="cart">
            <img src="assets/carts.png" alt="cart">
            <span>Cart ($56)</span>
        </div>
    </nav>
    </header>
    <main>
        <section class="hero-section container">
        <div class="hero-content font-inter">
            <h1 class="hero-title font-noto">
                <span class="text-dark">ALWAYS</span>
                <span class="text-primary">FRESH</span>
                <br>
                <span class="text-primary">FLOWERS</span>
            </h1>
            <p class="hero-subtitle">
                Indulge your senses with the beauty and fragrance 
                of our fresh flower shop. From classic roses to exotic 
                blooms, we offer a wide variety of fresh flowers that 
                are perfect for any occasion.
            </p>
            </div>
        <div class="hero-image">
            <img src="assets/hero-flower.png" alt="A beautiful bouquet of fresh flowers"> 
        </div>
    </section>
    </main>
    <footer></footer>
    
</body>
</html>
